<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 文档 - aytdai</title>
  <link rel="icon" type="image/jpeg" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEXQ0NqV4V-ssjvrXMyTT_TzUs8Eia1fwACLSsAAkvwwVal34_9VDjVuT0E.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <style>
    :root {
      --theme-color: #4F46E5;
    }
    .sidebar-nav > ul > li > a { font-weight: 600; }
    .markdown-section code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    .markdown-section pre { border-radius: 8px; }
    .markdown-section table { border-collapse: collapse; width: 100%; }
    .markdown-section th, .markdown-section td { border: 1px solid #e5e7eb; padding: 8px 12px; }
    .markdown-section th { background: #f9fafb; }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'API 文档',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: '搜索文档...',
        noData: '未找到结果',
        paths: 'auto',
        depth: 3
      },
      copyCode: {
        buttonText: '复制',
        successText: '已复制'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
